# CI: 9-job matrix — Deno v2.9 + Bun + Node 22 × Linux/macOS/Windows
# docs-browser (Playwright) runs on all cells except Bun + Windows.
# Linux: ubuntu-24.04 (not ubuntu-latest=26.04); Playwright 1.59.1 lacks chromium for 26.04 — same as view/dweb.
name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Docs E2E: allow slow cold start on CI runners
  UI_VIEW_DOCS_DEV_START_MS: "180000"

jobs:
  # ───────────────── Deno ─────────────────
  test-deno:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]  # pin 24.04: ubuntu-latest is 26.04; Playwright 1.59.1 has no chromium for ubuntu26.04
    runs-on: ${{ matrix.os }}
    # docs-browser on macOS Deno regularly approaches ~2h; match Node headroom
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      # GitHub releases CDN occasionally returns 504; action has short retry — one extra attempt
      - name: Setup Deno
        id: setup-deno
        continue-on-error: true
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9

      - name: Setup Deno (retry)
        if: steps.setup-deno.outcome == 'failure'
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cache dependencies
        continue-on-error: true
        run: deno cache src/mod.ts plugin.ts

      - name: Install Playwright Chromium (Linux + system deps)
        if: runner.os == 'Linux'
        run: npx -y playwright@1.59.1 install --with-deps chromium

      - name: Install Playwright Chromium
        if: runner.os != 'Linux'
        run: npx -y playwright@1.59.1 install chromium

      - name: Check
        run: deno check src/ plugin.ts

      - name: Lint
        run: deno lint src/

      # Shard docs-browser so macOS process/thread table can reset between batches.
      # Long single-process runs (~2h) end in Playwright/Deno spawn WouldBlock (os error 35).
      - name: Raise process limits (macOS)
        if: runner.os == 'macOS'
        run: |
          ulimit -n 10240 || true
          ulimit -u 2048 || true
          ulimit -a || true

      - name: Test (Deno — reconcile + top-level docs-browser)
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then ulimit -n 10240 || true; ulimit -u 2048 || true; fi
          deno test -A --minimum-dependency-age=0 \
            tests/docs-sidebar-reconcile.test.ts \
            tests/docs-browser/*.test.ts

      # Desktop page-tests are ~110 files. One shard on Deno macOS/Windows ran
      # 58–105 min and then flaked (stuck on document.complete / Playwright
      # disconnect). Split so the process table can reset between batches.
      - name: Test (Deno — page-tests desktop data-display)
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then ulimit -n 10240 || true; ulimit -u 2048 || true; fi
          deno test -A --minimum-dependency-age=0 \
            tests/docs-sidebar-reconcile.test.ts \
            tests/docs-browser/page-tests/page_desktop_data-display*.test.ts

      - name: Test (Deno — page-tests desktop form)
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then ulimit -n 10240 || true; ulimit -u 2048 || true; fi
          deno test -A --minimum-dependency-age=0 \
            tests/docs-sidebar-reconcile.test.ts \
            tests/docs-browser/page-tests/page_desktop_form*.test.ts

      - name: Test (Deno — page-tests desktop other)
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then ulimit -n 10240 || true; ulimit -u 2048 || true; fi
          rest=()
          for f in tests/docs-browser/page-tests/page_desktop*.test.ts; do
            case "$(basename "$f")" in
              page_desktop_data-display*.test.ts|page_desktop_form*.test.ts) ;;
              *) rest+=("$f") ;;
            esac
          done
          deno test -A --minimum-dependency-age=0 \
            tests/docs-sidebar-reconcile.test.ts \
            "${rest[@]}"

      - name: Test (Deno — page-tests mobile)
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then ulimit -n 10240 || true; ulimit -u 2048 || true; fi
          deno test -A --minimum-dependency-age=0 \
            tests/docs-sidebar-reconcile.test.ts \
            tests/docs-browser/page-tests/page_mobile*.test.ts

  # ───────────────── Bun ─────────────────
  test-bun:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]  # pin 24.04: ubuntu-latest is 26.04; Playwright 1.59.1 has no chromium for ubuntu26.04
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        id: setup-bun
        continue-on-error: true
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Bun (retry)
        if: steps.setup-bun.outcome == 'failure'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Docs app is Deno-based; reconcile warmup spawns PATH `deno` even when docs-browser is skipped on Windows
      - name: Setup Deno
        id: setup-deno-bun
        continue-on-error: true
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9

      - name: Setup Deno (retry)
        if: steps.setup-deno-bun.outcome == 'failure'
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9

      - name: Cache dependencies
        continue-on-error: true
        run: bun install || true

      - name: Install Playwright Chromium (Linux + system deps)
        if: matrix.os != 'windows-latest' && runner.os == 'Linux'
        run: npx -y playwright@1.59.1 install --with-deps chromium

      - name: Install Playwright Chromium
        if: matrix.os != 'windows-latest' && runner.os != 'Linux'
        run: npx -y playwright@1.59.1 install chromium

      - name: Test (Bun — unit + docs-browser)
        if: matrix.os != 'windows-latest'
        run: bun test tests/docs-sidebar-reconcile.test.ts tests/docs-browser/

      - name: Test (Bun — unit only; docs-browser skipped on Windows)
        if: matrix.os == 'windows-latest'
        env:
          # No docs-browser on this cell; skip sharedEnv.start() so we do not spawn a unused docs server
          UI_VIEW_SKIP_DOCS_DEV_WARMUP: "1"
        run: bun test tests/docs-sidebar-reconcile.test.ts

  # ───────────────── Node.js 22+ ─────────────────
  test-node:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]  # pin 24.04: ubuntu-latest is 26.04; Playwright 1.59.1 has no chromium for ubuntu26.04
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Docs E2E server entry is Deno
      - name: Setup Deno
        id: setup-deno-node
        continue-on-error: true
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9

      - name: Setup Deno (retry)
        if: steps.setup-deno-node.outcome == 'failure'
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9

      - name: Install dependencies
        run: npm install

      - name: Verify tsx loader (Node docs-browser)
        run: |
          node --input-type=module -e "import { existsSync } from 'node:fs'; import { pathToFileURL } from 'node:url'; const u = typeof import.meta.resolve==='function' ? import.meta.resolve('tsx') : pathToFileURL('node_modules/tsx/dist/loader.mjs').href; console.log('tsx', u); if (!existsSync('node_modules/tsx/package.json')) process.exit(1);"

      - name: Install Playwright Chromium (Linux + system deps)
        if: runner.os == 'Linux'
        run: npx -y playwright@1.59.1 install --with-deps chromium

      - name: Install Playwright Chromium
        if: runner.os != 'Linux'
        run: npx -y playwright@1.59.1 install chromium

      - name: Test (Node.js — unit + docs-browser)
        run: node --import tsx --test-force-exit test-node.mjs

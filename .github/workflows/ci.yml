# CI: 9-job matrix — Deno v2.9 + Bun + Node 22 × Linux/macOS/Windows
# docs-browser (Playwright) runs on all cells except Bun + Windows.
# Linux: ubuntu-24.04 (not ubuntu-latest=26.04); Playwright 1.59.1 lacks chromium for 26.04 — same as view/dweb.
name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Docs E2E: allow slow cold start on CI runners
  UI_VIEW_DOCS_DEV_START_MS: "180000"

jobs:
  # ───────────────── Deno ─────────────────
  test-deno:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]  # pin 24.04: ubuntu-latest is 26.04; Playwright 1.59.1 has no chromium for ubuntu26.04
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cache dependencies
        continue-on-error: true
        run: deno cache src/mod.ts plugin.ts

      - name: Install Playwright Chromium (Linux + system deps)
        if: runner.os == 'Linux'
        run: npx -y playwright@1.59.1 install --with-deps chromium

      - name: Install Playwright Chromium
        if: runner.os != 'Linux'
        run: npx -y playwright@1.59.1 install chromium

      - name: Check
        run: deno check src/ plugin.ts

      - name: Lint
        run: deno lint src/

      - name: Test (Deno — unit + docs-browser)
        run: deno test -A --minimum-dependency-age=0 tests/docs-sidebar-reconcile.test.ts tests/docs-browser/

  # ───────────────── Bun ─────────────────
  test-bun:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]  # pin 24.04: ubuntu-latest is 26.04; Playwright 1.59.1 has no chromium for ubuntu26.04
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Docs app is Deno-based; needed for docs-browser (skipped on Windows below)
      - uses: denoland/setup-deno@v2
        if: matrix.os != 'windows-latest'
        with:
          deno-version: v2.9

      - name: Cache dependencies
        continue-on-error: true
        run: bun install || true

      - name: Install Playwright Chromium (Linux + system deps)
        if: matrix.os != 'windows-latest' && runner.os == 'Linux'
        run: npx -y playwright@1.59.1 install --with-deps chromium

      - name: Install Playwright Chromium
        if: matrix.os != 'windows-latest' && runner.os != 'Linux'
        run: npx -y playwright@1.59.1 install chromium

      - name: Test (Bun — unit + docs-browser)
        if: matrix.os != 'windows-latest'
        run: bun test tests/docs-sidebar-reconcile.test.ts tests/docs-browser/

      - name: Test (Bun — unit only; docs-browser skipped on Windows)
        if: matrix.os == 'windows-latest'
        run: bun test tests/docs-sidebar-reconcile.test.ts

  # ───────────────── Node.js 22+ ─────────────────
  test-node:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]  # pin 24.04: ubuntu-latest is 26.04; Playwright 1.59.1 has no chromium for ubuntu26.04
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Docs E2E server entry is Deno
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Chromium (Linux + system deps)
        if: runner.os == 'Linux'
        run: npx -y playwright@1.59.1 install --with-deps chromium

      - name: Install Playwright Chromium
        if: runner.os != 'Linux'
        run: npx -y playwright@1.59.1 install chromium

      - name: Test (Node.js — unit + docs-browser)
        run: node --import tsx --test-force-exit test-node.mjs
